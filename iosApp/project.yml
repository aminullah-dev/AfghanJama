# پروژهٔ Xcode از این فایل ساخته می‌شود، نه دستی.
#
# چرا xcodegen: فایلِ `.pbxproj` چند هزار خطِ تولیدشده است که هیچ‌کس
# نمی‌خوانَدش و هر ادغام رویش تعارض می‌دهد. این چهل خط همان را توصیف
# می‌کند و با `xcodegen generate` ساخته می‌شود.
name: KhayatYar
options:
  bundleIdPrefix: com.afghanjama
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true

targets:
  KhayatYar:
    type: application
    platform: iOS
    sources:
      - path: KhayatYar

      # قلمِ وزیر — همان فایل‌هایی که اندروید از `res/font` برمی‌دارد.
      # کپی نمی‌شوند: مسیرشان به خودِ پوشهٔ اندروید اشاره می‌کند تا دو
      # نسخه از یک فونت وجود نداشته باشد که روزی یکی به‌روز شود و آن
      # یکی نه.
      #
      # **زیرِ `sources` و نه `resources`.** xcodegen کلیدی به نامِ
      # `resources` ندارد و کلیدِ ناشناس را بی هیچ هشداری دور می‌اندازد.
      # نتیجه‌اش این بود که هر سه فونت از پروژهٔ تولیدشده غایب بودند و
      # بستهٔ ساخته‌شده هیچ `.ttf` نداشت.
      #
      # و چون `bundledFont` عمداً سرِ نبودنِ فونت نمی‌شکند (فارسیِ
      # بدشکل بهتر از پنجرهٔ بازنشده است)، برنامه سالم بالا می‌آمد و
      # فقط با قلمِ پیش‌فرضِ آیفون — یعنی خطایی که هیچ‌جا گزارش
      # نمی‌شد.
      #
      # `buildPhase` صریح است چون تکیه بر حدسِ پسوند همان جنسِ
      # سکوتی است که این اشکال را ساخت.
      - path: ../app/src/main/res/font/vazirmatn_regular.ttf
        buildPhase: resources
      - path: ../app/src/main/res/font/vazirmatn_semibold.ttf
        buildPhase: resources
      - path: ../app/src/main/res/font/vazirmatn_bold.ttf
        buildPhase: resources
    # Build the Kotlin framework for the SDK being built, before compiling Swift.
    # framework کاتلین را پیش از کامپایلِ Swift، برای همان SDK می‌سازد.
    # (static است، پس جداگانه embed/sign نمی‌شود؛ در خودِ باینری پیوند می‌خورد.)
    preBuildScripts:
      - name: Build Kotlin framework (Gradle)
        basedOnDependencyAnalysis: false
        script: |
          set -e
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          if [ -z "$JAVA_HOME" ] && /usr/libexec/java_home >/dev/null 2>&1; then
            export JAVA_HOME="$(/usr/libexec/java_home)"
          fi
          case "$PLATFORM_NAME" in
            iphoneos)        TARGET=IosArm64 ;;
            iphonesimulator) TARGET=IosSimulatorArm64 ;;
            *) echo "unsupported SDK $PLATFORM_NAME"; exit 1 ;;
          esac
          cd "$SRCROOT/.."
          ./gradlew --no-daemon -q ":core:linkDebugFramework$TARGET"
    info:
      path: KhayatYar/Info.plist
      properties:
        CFBundleDisplayName: خیاط‌یار
        # **این کلید اختیاری نیست — بی آن برنامه سرِ راه‌اندازی می‌میرد.**
        #
        # Compose خودش `Info.plist` را می‌سنجد و اگر نباشد استثنا
        # می‌اندازد، نه هشدار:
        #
        #     Info.plist doesn't have a valid
        #     CADisableMinimumFrameDurationOnPhone entry
        #
        # دلیلش کارایی است: آیفون‌های ProMotion بی این کلید نرخِ
        # تازه‌سازیِ برنامه را روی ۶۰ هرتز قفل می‌کنند و پیمایشِ فهرستِ
        # سفارش‌ها نصفِ روانیِ خودش را از دست می‌دهد.
        CADisableMinimumFrameDurationOnPhone: true
        UILaunchStoryboardName: ""
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.afghanjama.khayatyar
        # **شبیه‌ساز فقط arm64 — و این باید صریح نوشته شود.**
        #
        # `:core` عمداً هدفِ `iosX64` ندارد (دلیلش در `core/build.gradle.kts`
        # آمده: شبیه‌سازِ اینتلی فقط روی مکِ اینتل معنی دارد). ولی Xcode
        # این را نمی‌داند و برای شبیه‌ساز هر دو معماری را می‌خواهد.
        #
        # روی مکِ خودمان پنهان می‌مانْد، چون ساخت برای یک شبیه‌سازِ
        # مشخص فقط معماریِ فعال را می‌سازد. ساختِ generic (همان چیزی
        # که CI می‌کند) هر دو را می‌خواهد و با این می‌شکند:
        #
        #     Undefined symbols for architecture x86_64:
        #       "_OBJC_CLASS_$_KYKIosAppKt"
        #
        # یعنی خطایی که فقط روی CI دیده می‌شد و شبیهِ اشکالِ کد بود، نه
        # اشکالِ پیکربندی.
        EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
        # Device signing / امضای دستگاه: automatic, Apple team 27RXPRW77S.
        # شبیه‌ساز امضا نمی‌خواهد؛ این فقط وقتی کار می‌کند که آیفون واقعی
        # مقصد باشد (و CODE_SIGNING_ALLOWED=NO در CI آن را بی‌اثر می‌کند).
        DEVELOPMENT_TEAM: 27RXPRW77S
        CODE_SIGN_STYLE: Automatic
        # The Gradle script below shells out; Xcode's script sandbox forbids it.
        # اسکریپتِ پایین Gradle را اجرا می‌کند و سندباکسِ Xcode اجازه نمی‌دهد.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        # frameworkِ کاتلین اینجا نشسته و ساختش کارِ Gradle است — هدفِ
        # درست بسته به SDK: iosArm64 برای آیفون، iosSimulatorArm64 برای
        # شبیه‌ساز (همان دو مسیری که اسکریپتِ پایین می‌سازد).
        FRAMEWORK_SEARCH_PATHS:
          - $(inherited)
        "FRAMEWORK_SEARCH_PATHS[sdk=iphoneos*]":
          - $(inherited)
          - $(SRCROOT)/../core/build/bin/iosArm64/debugFramework
        "FRAMEWORK_SEARCH_PATHS[sdk=iphonesimulator*]":
          - $(inherited)
          - $(SRCROOT)/../core/build/bin/iosSimulatorArm64/debugFramework
        OTHER_LDFLAGS:
          - $(inherited)
          - -framework
          - KhayatYarKit
        SWIFT_VERSION: "5.0"
