# gradle.properties (root)

# ---------------------------------------------------------------------
# نسخهٔ برنامه — **یک جا، برای هر دو سکو.**
#
# تا دیروز دو جا بود و از هم افتاده بود: اندروید `versionName = "1.0"` و
# ویندوز `packageVersion = "1.0.0"`. هیچ‌کدام از دیگری خبر نداشت، پس یک
# نسخه‌ی واحد از برنامه دو عدد داشت و روی کاغذِ پشتیبانی معلوم نمی‌شد
# کارگاه کدام را دارد.
#
# `appVersion` رشته است و هر دو سکو همین را می‌گیرند.
#
# **قالبش را دلبخواه عوض نکنید: سه بخشِ عددی.** نصب‌کنندهٔ ویندوز فقط
# سه بخشِ اول را می‌سنجد و بازه‌شان محدود است (دو بخشِ اول تا ۲۵۵، سومی
# تا ۶۵۵۳۵). بررسیِ `appversion` این را وارسی می‌کند.
#
# **و برای اینکه MSIِ تازه جای نصب‌شده را بگیرد، این عدد باید بالا
# برود.** با نسخهٔ یکسان، ویندوز به‌روزرسانی را رد می‌کند —
# `upgradeUuid` ثابت است ولی به‌تنهایی کافی نیست.
appVersion=1.7.0

# فقط اندروید. عددِ صحیح و **همیشه یکی بیشتر از نسخهٔ قبل**، وگرنه
# گوشی آپدیت را نصب نمی‌کند. ربطی به `appVersion` ندارد و کاربر
# نمی‌بیندش.
appVersionCode=12
# ---------------------------------------------------------------------

org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
kotlin.jvmToolchain=17
kotlin.compiler.execution.strategy=in-process
kotlin.daemon.jvmargs=-Xmx2048m

# ═══ ابزارِ Kotlin/Native: دانلودگرِ قدیمی، نه «toolchain» ═══
#
# **بی این خط، این مخزن از یک ماشینِ تمیز اصلاً ساخته نمی‌شود.**
#
# از کاتلین ۱.۹ به بعد، ابزارِ Kotlin/Native به‌جای دانلودگرِ خودِ
# افزونه، از راهِ وابستگیِ Gradle می‌آید (`kotlin.native.toolchain`).
# ولی پردازشگرِ KSP برای هدفِ بومی به آن مهیّاسازی وابسته نیست: تسکش
# پیش از آن می‌دود، `~/.konan` هنوز خالی است، و چون کامپایلر
# `in-process` بار می‌شود خطایی می‌دهد که اصلاً بوی «فایل دانلود نشده»
# نمی‌دهد:
#
#     Can't find env_blacklist file at ~/.konan/kotlin-native-prebuilt-macos-aarch64-2.1.20/tools/env_blacklist
#     java.lang.ClassNotFoundException: org.jetbrains.kotlin.cli.utilities.MainKt
#
# و در چهار ثانیه می‌شکند، یعنی حتی تلاشی برای دانلود نمی‌کند.
#
# **چرا تا امروز دیده نشد.** روی مکی که یک بار ساخته باشد `~/.konan`
# از قبل پر است و هیچ‌کس متوجه نمی‌شود. اولین اجرای کارِ iOS روی
# گیت‌هاب — یعنی اولین ماشینِ واقعاً تمیز — همان‌جا ایستاد.
#
# `false` یعنی افزونه به دانلودگرِ قدیمیِ خودش برمی‌گردد، که توزیع را
# داخلِ خودِ تسک و درست وقتی لازم است می‌آورد. سنجیده شد: با کنار
# گذاشتنِ `~/.konan` و همین خط، ساخت خودش دانلود می‌کند و سبز می‌شود.
kotlin.native.toolchain.enabled=false
