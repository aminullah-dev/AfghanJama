# gradle.properties (root)

# ---------------------------------------------------------------------
# نسخهٔ برنامه — **یک جا، برای هر دو سکو.**
#
# تا دیروز دو جا بود و از هم افتاده بود: اندروید `versionName = "1.0"` و
# ویندوز `packageVersion = "1.0.0"`. هیچ‌کدام از دیگری خبر نداشت، پس یک
# نسخه‌ی واحد از برنامه دو عدد داشت و روی کاغذِ پشتیبانی معلوم نمی‌شد
# کارگاه کدام را دارد.
#
# `appVersion` رشته است و هر دو سکو همین را می‌گیرند.
#
# **قالبش را دلبخواه عوض نکنید: سه بخشِ عددی.** نصب‌کنندهٔ ویندوز فقط
# سه بخشِ اول را می‌سنجد و بازه‌شان محدود است (دو بخشِ اول تا ۲۵۵، سومی
# تا ۶۵۵۳۵). بررسیِ `appversion` این را وارسی می‌کند.
#
# **و برای اینکه MSIِ تازه جای نصب‌شده را بگیرد، این عدد باید بالا
# برود.** با نسخهٔ یکسان، ویندوز به‌روزرسانی را رد می‌کند —
# `upgradeUuid` ثابت است ولی به‌تنهایی کافی نیست.
appVersion=1.1.2

# فقط اندروید. عددِ صحیح و **همیشه یکی بیشتر از نسخهٔ قبل**، وگرنه
# گوشی آپدیت را نصب نمی‌کند. ربطی به `appVersion` ندارد و کاربر
# نمی‌بیندش.
appVersionCode=4
# ---------------------------------------------------------------------

org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
kotlin.jvmToolchain=17
kotlin.compiler.execution.strategy=in-process
kotlin.daemon.jvmargs=-Xmx2048m
