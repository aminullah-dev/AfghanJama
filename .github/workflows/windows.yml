name: بستهٔ ویندوز

# جدا از ساختِ APK، و این عمدی است:
#
# MSI را فقط ویندوز می‌سازد (`jpackage` به WiX نیاز دارد). رانرِ ساختِ
# APK لینوکس است، پس این کار آنجا شدنی نیست. جدا بودنشان یعنی اگر
# بسته‌بندیِ ویندوز روزی بشکند، اپِ اندروید همچنان ساخته و تحویل
# می‌شود.
on:
  push:
    branches: ["**"]
    paths:
      - "desktop/**"
      - "core/**"
      - "gradle/**"
      - "*.gradle.kts"
      # **بی این خط، انتشارِ نسخه هیچ ساختی راه نمی‌انداخت.**
      #
      # نسخه حالا فقط در `gradle.properties` است. `gradle/**` پوشهٔ
      # wrapper را می‌گیرد نه این فایلِ ریشه را، و `*.gradle.kts` هم
      # پسوندش نمی‌خورد. یعنی تنها ویرایشی که یک انتشار را می‌سازد،
      # هیچ‌کدام از فیلترها را فعال نمی‌کرد — و CI سبز می‌ماند چون
      # اصلاً چیزی اجرا نشده بود.
      - "gradle.properties"
      - ".github/workflows/windows.yml"
  workflow_dispatch:

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: کشِ Gradle
        uses: gradle/actions/setup-gradle@v4

      # این فایل به مسیرِ SDK روی کامپیوترِ شخصی اشاره می‌کند و روی
      # ماشینِ CI وجود ندارد.
      - name: برداشتنِ local.properties
        shell: bash
        run: rm -f local.properties

      # **بررسی‌های ساختاری روی هیچ شاخه‌ای اجرا نمی‌شدند.**
      #
      # `apk.yml` این‌ها را دارد ولی فقط روی `claude/**` راه می‌افتد
      # (`apk.yml` بندِ `on:`). روی `main` هیچ‌کس آن‌ها را اجرا نمی‌کرد —
      # یعنی نسخهٔ بدشکل، زنجیرهٔ پارهٔ مهاجرت و کپیِ کهنهٔ SQL همه
      # بی‌نگهبان بودند.
      #
      # چند ثانیه می‌گیرند و پیش از ده دقیقه ساخت جواب می‌دهند، پس
      # اول از همه.
      - name: بررسی‌های ساختاری
        shell: bash
        run: python tools/checks/run_all.py

      # پوشهٔ اجرایی — همیشه ساخته می‌شود و به WiX نیاز ندارد.
      #
      # برای کارگاه این حتی از نصب‌کننده هم عملی‌تر است: پوشه را روی
      # پی‌سی کپی می‌کنی و `KhayatYar.exe` را می‌زنی. نه نصبی، نه
      # دسترسیِ مدیری.
      - name: ساختِ پوشهٔ اجرایی
        shell: bash
        run: ./gradlew --no-daemon :desktop:createDistributable

      # `jpackage` پیامِ خطایش را در فایل می‌نویسد نه روی صفحه، پس
      # بدونِ این مرحله فقط «exit code 1» دیده می‌شود.
      - name: چاپِ خطای jpackage وقتی شکست
        if: failure()
        shell: bash
        run: |
          for f in $(find desktop/build/compose/logs -name '*.txt' 2>/dev/null); do
            echo "===== $f ====="
            cat "$f"
          done

      # سبزبودنِ مرحلهٔ ساخت کافی نیست: اگر jpackage چیزی تولید نکند هم
      # ممکن است موفق گزارش دهد. اینجا وجودِ خودِ فایلِ اجرایی وارسی
      # می‌شود.
      - name: مطمئن شو exe واقعاً ساخته شد
        shell: bash
        run: |
          exe=$(find desktop/build/compose/binaries -name 'KhayatYar.exe' | head -1)
          if [ -z "$exe" ]; then
            echo "هیچ KhayatYar.exe ساخته نشد."
            find desktop/build/compose -maxdepth 4 -type d || true
            exit 1
          fi
          echo "ساخته شد: $exe"
          du -sh "$(dirname "$exe")"

      # ---------------------------------------------------------------
      # **مهم‌ترین مرحلهٔ این فایل.**
      #
      # تا امروز CI فقط ثابت می‌کرد `exe` *ساخته* می‌شود، نه اینکه *بالا
      # می‌آید*. و دقیقاً همان‌جا خراب شد: بسته سبز بود ولی روی پی‌سیِ
      # کارگاه «Failed to launch JVM» می‌داد، چون `java.desktop` در JVMِ
      # همراه نبود.
      #
      # اینجا برنامه واقعاً اجرا می‌شود. اگر JVM بالا نیاید، فرایند
      # بی‌درنگ می‌میرد و این مرحله قرمز می‌شود — همان چیزی که باید
      # پیش از رسیدن به دستِ کارگاه گرفته شود.
      #
      # ۲۵ ثانیه صبر می‌کند: بالا آمدنِ Compose و باز شدنِ دیتابیس روی
      # رانر کند است و کمتر از این هشدارِ نادرست می‌دهد.
      # **زنده‌بودن کافی نیست — این درس گران تمام شد.**
      #
      # نسخهٔ اولِ این مرحله فقط `kill -0` می‌زد: «آیا فرایند بعد از ۲۵
      # ثانیه هنوز هست؟» و سبز می‌ماند. ولی برنامه‌ای که رشتهٔ `main`ش
      # مرده و فقط رشتهٔ AWT نفس می‌کشد **هنوز هست** و هیچ پنجره‌ای
      # ندارد. دقیقاً همین افتاد: دو `androidx.compose.runtime` در بسته
      # بود، برنامه با `NoSuchMethodError` می‌مرد، و این مرحله سبز بود.
      #
      # پس حالا خطای استاندارد هم خوانده می‌شود: هر استثنا یعنی قرمز،
      # حتی اگر فرایند زنده مانده باشد.
      - name: مطمئن شو برنامه واقعاً بالا می‌آید
        shell: bash
        run: |
          exe=$(find desktop/build/compose/binaries -name 'KhayatYar.exe' | head -1)
          echo "اجرا: $exe"
          "$exe" >app-out.txt 2>app-err.txt &
          pid=$!
          sleep 25
          alive=0
          kill -0 "$pid" 2>/dev/null && alive=1
          kill "$pid" 2>/dev/null || true

          if [ -s app-err.txt ]; then
            echo "✗ برنامه روی خطای استاندارد چیزی نوشت:"
            cat app-err.txt
            exit 1
          fi

          if [ "$alive" = "1" ]; then
            echo "✓ برنامه ۲۵ ثانیه سرِ پا ماند و هیچ استثنایی نداد."
          else
            echo "✗ برنامه بی‌درنگ بسته شد."
            echo "  یعنی JVMِ همراه ناقص است یا برنامه سرِ شروع می‌ترکد."
            cat app-out.txt || true
            exit 1
          fi

      # ---------------------------------------------------------------
      # **مهم‌ترین گاردِ این فایل.**
      #
      # مرحلهٔ بالا فقط می‌گوید «برنامه بالا آمد». نمی‌گوید صفحه‌ها کار
      # می‌کنند. و خرابیِ واقعی همان‌جا بود: آیکن‌ها در `:core` فقط
      # `compileOnly` بودند، پس کامپایل سبز می‌شد، پنجره باز می‌شد، و
      # هر بخشی که کاربر باز می‌کرد با `NoClassDefFoundError` می‌مرد.
      #
      # اینجا هر هشت بخش واقعاً ترکیب و رسم می‌شوند — روی همان jarهایی
      # که به کارگاه می‌روند، نه روی classpathِ Gradle. (این دو یکی
      # نیستند: خرابیِ دو-Composeای فقط در بسته دیده می‌شد.)
      - name: مطمئن شو صفحه‌ها واقعاً ترکیب می‌شوند
        shell: bash
        run: ./gradlew --no-daemon :desktop:screenSmoke

      # ---------------------------------------------------------------
      # عکسِ هر صفحه، از همان بسته‌ای که به کارگاه می‌رود.
      #
      # **چرا لازم است.** مرحلهٔ بالا فقط می‌گوید صفحه ترکید یا نه.
      # ولی صفحه‌ای می‌تواند بی‌عیب رسم شود و همچنان غلط باشد: متنِ
      # بریده، ستونی که به هیچ جمع شده، رنگی که خوانده نمی‌شود. هیچ
      # کدام استثنا نمی‌دهند و هیچ بررسیِ ساختاری‌ای نمی‌گیردشان.
      #
      # با این artifact می‌شود بدونِ داشتنِ یک ویندوزِ واقعی دید پنجره
      # **چه شکلی است** — همان چیزی که تا امروز فقط با نشستن پای پی‌سی
      # ممکن بود.
      #
      # `if: always()` عمدی است: وقتی صفحه‌ای شکست، عکسِ بقیه از همیشه
      # لازم‌تر است.
      - name: بارگذاریِ عکسِ صفحه‌ها
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screens-windows
          path: desktop/build/screens/
          if-no-files-found: warn

      # ---------------------------------------------------------------
      # راهِ بالا بردنِ دفتر.
      #
      # تا دیروز نسخهٔ ویندوز **هیچ** مهاجرتی نداشت: دیتابیس مستقیم روی
      # `DB_VERSION` ساخته می‌شد. یعنی اولین باری که آن عدد جلو می‌رفت،
      # هر دفترِ ویندوزیِ موجود باز نمی‌شد — و چون
      # `fallbackToDestructiveMigration` اینجا عمداً نیست، کارگاه با یک
      # پیغامِ خطا می‌ماند و کار می‌خوابید.
      #
      # `migrationgap` (در بررسی‌های ساختاری) می‌گوید گام نوشته شده یا
      # نه. این می‌گوید سرِ اجرا کار می‌کند یا نه — روی فایلِ موقتی، با
      # همان موتورِ کارگاه.
      - name: مطمئن شو مهاجرت واقعاً اجرا می‌شود
        shell: bash
        run: ./gradlew --no-daemon :desktop:migrationSmoke

      # بازیابی تنها جایی است که دفترِ کارگاه بازنویسی می‌شود. اگر فایلِ
      # خراب یا فایلِ نسخهٔ جلوتر پذیرفته شود، نتیجه‌اش پاک شدنِ همان
      # چیزی است که پشتیبان قرار بود نجاتش دهد.
      - name: مطمئن شو پشتیبان و بازیابی سالم‌اند
        shell: bash
        run: ./gradlew --no-daemon :desktop:backupSmoke

      # `AuthViewModel` از `SharedPreferences` به `Settings` منتقل شد تا
      # ویندوز هم درِ ورود داشته باشد. منطق دست نخورد ولی لایهٔ
      # ذخیره‌سازی عوض شد — و این یک گاردِ امنیتی است.
      - name: مطمئن شو ورود و نقش کار می‌کنند
        shell: bash
        run: ./gradlew --no-daemon :desktop:authSmoke

      # دو اشکالی که دادهٔ خاموشِ غلط می‌دادند نه استثنا: نشانی با درگاهِ
      # اضافه، و سرور که اتصالِ دومی به دفتر باز می‌کرد.
      - name: مطمئن شو مرزِ شبکه سالم است
        shell: bash
        run: ./gradlew --no-daemon :desktop:lanSmoke

      # کاغذ: جهتِ راست‌به‌چپ باید همان باشد که اندازه‌گیری شده، و نشانهٔ
      # افغانی باید کشیده شود نه مربعِ خالی.
      - name: مطمئن شو کاغذ درست چیده می‌شود
        shell: bash
        run: ./gradlew --no-daemon :desktop:pdfSmoke

      # فهرستِ ماژول‌های JVMِ همراه — مدرک، نه حدس. اگر روزی دوباره
      # چیزی کم بود، همین‌جا دیده می‌شود.
      - name: فهرستِ ماژول‌های JVMِ همراه
        if: always()
        shell: bash
        run: |
          rel=$(find desktop/build/compose/binaries -name release -path '*runtime*' | head -1)
          [ -n "$rel" ] && grep -o 'MODULES=.*' "$rel" | tr ' ' '\n' | head -40 || echo "فایلِ release پیدا نشد"

      - name: بارگذاری پوشهٔ اجرایی
        uses: actions/upload-artifact@v4
        with:
          name: khayatyar-windows-${{ github.sha }}
          path: desktop/build/compose/binaries/main/app/
          if-no-files-found: error
          retention-days: 30

      # نصب‌کنندهٔ MSI به WiX نیاز دارد و روی هر رانری نیست.
      # `continue-on-error` یعنی نبودنش کلِ کار را قرمز نمی‌کند —
      # پوشهٔ اجرایی از قبل بارگذاری شده.
      - name: ساختِ نصب‌کنندهٔ MSI
        id: msi
        shell: bash
        continue-on-error: true
        run: ./gradlew --no-daemon :desktop:packageMsi

      - name: بارگذاری MSI
        if: steps.msi.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: khayatyar-msi-${{ github.sha }}
          path: desktop/build/compose/binaries/main/msi/*.msi
          if-no-files-found: warn
          retention-days: 30
